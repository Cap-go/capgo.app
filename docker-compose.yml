# Vanilla Postgres 17 for Phase 0 migration compatibility testing.
# Does NOT include GoTrue, PostgREST, Studio, Realtime, or Storage API.
# Use `bun run postgres:vanilla:push` to apply supabase/migrations/ via the Supabase CLI.
services:
  postgres:
    image: postgres:17-alpine
    container_name: capgo-vanilla-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${VANILLA_POSTGRES_USER}
      POSTGRES_PASSWORD: ${VANILLA_POSTGRES_PASSWORD}
      POSTGRES_DB: ${VANILLA_POSTGRES_DB}
    volumes:
      - capgo_vanilla_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d capgo']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  capgo_vanilla_postgres_data:
