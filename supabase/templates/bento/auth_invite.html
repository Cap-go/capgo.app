<!-- Bento event: auth:invite -->
<!-- Subject: [Capgo]: You have been invited to Capgo.app -->

<p>Hi,</p>

<p>You have been invited to create a user on Capgo.app.</p>

<p>To accept the invitation and complete your account setup, please follow the link below:</p>

<p>
  <a
    href="{{ event.details.site_url }}/confirm-signup?confirmation_url={{ event.details.confirmation_url }}"
    target="_blank"
    rel="noopener noreferrer nofollow"
    style="
      background-color: #2563eb;
      color: #ffffff;
      border-radius: 8px;
      font-size: 14px;
      text-decoration: none;
      font-weight: bold;
      padding: 8px 16px;
      display: inline-block;
    "
  >
    Accept the invitation
  </a>
</p>

<p>If you did not expect this invitation, you can safely ignore this email.</p>

<p style="color: #6c757d;">- Martin, Founder of Capgo.app</p>
