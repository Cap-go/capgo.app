<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark" />
  <meta name="viewport"
    content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/pwa-192x192.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#00aba9">
  <meta name="msapplication-TileColor" content="#00aba9">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="webapp to manage your OTA updates for capacitor">
  <meta name="title" content="Capgo app">
  <title>Capgo app</title>
  <style>
    :root {
      --app-loader-background: #f8fafc;
      --app-loader-logo-color: #0f172a;
    }

    :root[data-theme='capgodark'] {
      --app-loader-background: #0f172a;
      --app-loader-logo-color: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme='capgolight']) {
        --app-loader-background: #0f172a;
        --app-loader-logo-color: #ffffff;
      }
    }

    html,
    body {
      margin: 0;
      background-color: var(--app-loader-background);
    }

    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--app-loader-background);
    }

    /* Animated Capgo mark, same markup as src/components/CapgoLoader.vue */
    #app-loader svg {
      width: 96px;
      height: 96px;
      color: var(--app-loader-logo-color);
    }

    #app-loader .ring {
      opacity: 0.18;
    }

    #app-loader .trace {
      stroke: #119eff;
      stroke-dasharray: 30 70;
      animation: app-loader-trace 1.6s linear infinite;
    }

    #app-loader .mark {
      transform-box: fill-box;
      transform-origin: center;
      animation: app-loader-mark 1.6s ease-in-out infinite;
    }

    @keyframes app-loader-trace {
      to {
        stroke-dashoffset: -100;
      }
    }

    @keyframes app-loader-mark {
      0%,
      100% {
        opacity: 0.55;
        transform: scale(0.9);
      }

      50% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #app-loader .trace {
        display: none;
      }

      #app-loader .mark {
        animation: none;
      }

      #app-loader .ring {
        opacity: 1;
      }
    }
  </style>
</head>

<body class="overflow-hidden h-full antialiased font-inter">
  <div id="app-loader" role="status" aria-label="Loading Capgo">
    <svg viewBox="0 0 1024 1024" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="app-loader-ring">
          <path d="M264.2 265.3 17 512.5 264.5 760 512 1007.5 759.5 760 1007 512.5 759.8 265.3C623.8 129.3 512.3 18 512 18c-.3 0-111.8 111.3-247.8 247.3zm438.5 55.9C807.4 425.9 893 511.9 893 512.5c0 .5-85.7 86.7-190.5 191.5L512 894.5l-191-191-191-191 190.7-190.7c105-105 191-190.8 191.3-190.8.3 0 86.1 85.6 190.7 190.2z" />
        </clipPath>
      </defs>
      <path class="ring" fill="currentColor" d="M264.2 265.3 17 512.5 264.5 760 512 1007.5 759.5 760 1007 512.5 759.8 265.3C623.8 129.3 512.3 18 512 18c-.3 0-111.8 111.3-247.8 247.3zm438.5 55.9C807.4 425.9 893 511.9 893 512.5c0 .5-85.7 86.7-190.5 191.5L512 894.5l-191-191-191-191 190.7-190.7c105-105 191-190.8 191.3-190.8.3 0 86.1 85.6 190.7 190.2z" />
      <polygon class="trace" clip-path="url(#app-loader-ring)" points="512,74 950,512 512,950 74,512" pathLength="100" fill="none" stroke-width="120" />
      <g class="mark" fill="currentColor">
        <path d="M440.8 347c-12.6 12.6-22.8 23.3-22.8 23.7 0 .5 53 53.7 117.8 118.4l117.7 117.7 23.2-23.3 23.1-23.2-47.4-47.4-47.4-47.4 47.5-47.5 47.5-47.5-23.3-23.3-23.2-23.2-47.5 47.5-47.5 47.5-47.5-47.4-47.5-47.5-22.7 22.9z" />
        <path d="M347 441.2 324.5 464l47.3 47.3 47.2 47.2-47.4 47.7-47.3 47.6 23 23 23 23 47.5-47.5 47.5-47.5 47.3 47.3c26 26 47.5 47.1 47.8 46.9 6.6-6.3 45.6-45.5 45.6-45.9 0-1.2-234.5-235.1-235.5-234.9-.6 0-11.1 10.4-23.5 23z" />
      </g>
    </svg>
  </div>
  <div id="app" class="overflow-hidden h-full"></div>
  <script src="/theme-bootstrap.js"></script>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
