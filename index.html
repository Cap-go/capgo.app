<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark" />
  <meta name="viewport"
    content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/pwa-192x192.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#00aba9">
  <meta name="msapplication-TileColor" content="#00aba9">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="webapp to manage your OTA updates for capacitor">
  <meta name="title" content="Capgo app">
  <title>Capgo app</title>
  <style>
    :root {
      --app-loader-background: #f8fafc;
      --app-loader-logo-filter: invert(1);
    }

    :root[data-theme='capgodark'] {
      --app-loader-background: #0f172a;
      --app-loader-logo-filter: invert(0);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme='capgolight']) {
        --app-loader-background: #0f172a;
        --app-loader-logo-filter: invert(0);
      }
    }

    html,
    body {
      margin: 0;
      background-color: var(--app-loader-background);
    }

    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--app-loader-background);
    }

    #app-loader img {
      width: 150px;
      height: 150px;
      filter: var(--app-loader-logo-filter);
    }
  </style>
</head>

<body class="overflow-hidden h-full antialiased font-inter">
  <div id="app-loader" role="status" aria-label="Loading Capgo">
    <img src="/capgo.webp" alt="" width="150" height="150" />
  </div>
  <div id="app" class="overflow-hidden h-full"></div>
  <script src="/theme-bootstrap.js"></script>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
