name: Refresh website console screenshots

# Regenerates the console screenshots shown on capgo.app from a local stack with
# fake demo data (scripts/marketing-screenshots) and opens a PR on Cap-go/website.
# Requires the WEBSITE_REPO_TOKEN secret: a token that can push branches and open
# pull requests on Cap-go/website. Without it the job captures and uploads the
# images as an artifact only.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      filter:
        description: Only capture shots whose name starts with this prefix (empty = all)
        required: false
        default: ''
      videos:
        description: Also re-record the looping videos (slower; needs ffmpeg)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: marketing-screenshots
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_WORKTREE_INSTANCE: marketing-screenshots-${{ github.run_id }}
      WEBSITE_REPO_TOKEN: ${{ secrets.WEBSITE_REPO_TOKEN }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup bun
        run: bash scripts/setup-bun.sh
      - name: Install dependencies
        run: bun install
      - id: playwright_version
        name: Resolve Playwright version
        run: echo "version=$(bun -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright_browser_cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-shell-${{ runner.os }}-${{ steps.playwright_version.outputs.version }}
      - name: Install Playwright browser
        if: steps.playwright_browser_cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps --only-shell chromium
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
      - name: Link Supabase templates
        run: ln -sfn supabase/templates templates
      - name: Start frontend build in background
        run: nohup bun scripts/playwright-frontend-preview.ts > "${RUNNER_TEMP}/frontend.log" 2>&1 &
      - name: Start Supabase
        run: bun run supabase:start
      - name: Wait for frontend
        run: bunx wait-on@8.0.1 http-get://localhost:5173 --timeout 600000 --interval 1000
      - name: Checkout website
        if: env.WEBSITE_REPO_TOKEN != ''
        uses: actions/checkout@v6
        with:
          repository: Cap-go/website
          token: ${{ secrets.WEBSITE_REPO_TOKEN }}
          path: website
      - name: Install ffmpeg
        if: inputs.videos
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Capture screenshots
        env:
          BASE_URL: http://localhost:5173
          OUT_DIR: ${{ runner.temp }}/marketing-screenshots
          WEBSITE_DIR: ${{ env.WEBSITE_REPO_TOKEN != '' && format('{0}/website', github.workspace) || '' }}
          # Passed through env, not interpolated into the script, so the input cannot inject shell.
          FILTER: ${{ inputs.filter }}
          VIDEOS: ${{ inputs.videos && 'true' || 'false' }}
        run: |
          args=()
          if [ -n "$FILTER" ]; then args+=("$FILTER"); fi
          if [ "$VIDEOS" = "true" ]; then args+=(--videos); fi
          bun run screenshots:marketing -- "${args[@]}"
      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketing-screenshots
          path: ${{ runner.temp }}/marketing-screenshots
          retention-days: 14
      - name: Open website pull request
        if: env.WEBSITE_REPO_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_REPO_TOKEN }}
        working-directory: website
        run: |
          if git diff --quiet -- apps/web/public/landing-demos && [ -z "$(git status --porcelain -- apps/web/public/landing-demos)" ]; then
            echo "No screenshot changes."
            exit 0
          fi
          branch=chore/refresh-console-screenshots
          git config user.name "capgo-bot"
          git config user.email "bot@capgo.app"
          git switch -C "$branch"
          git add apps/web/public/landing-demos
          git commit -m "chore(web): refresh console screenshots" -m "Generated by Cap-go/capgo.app scripts/marketing-screenshots (run ${{ github.run_id }})."
          git push --force origin "$branch"
          if ! gh pr view "$branch" --json state --jq '.state' 2>/dev/null | grep -q OPEN; then
            gh pr create --base main --head "$branch" \
              --title "chore(web): refresh console screenshots" \
              --body "Weekly refresh of the console screenshots, captured from the Capgo demo stack with fake data by [scripts/marketing-screenshots](https://github.com/Cap-go/capgo.app/tree/main/scripts/marketing-screenshots). Check the images, then merge. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
      - name: Show frontend log after failure
        if: failure()
        run: tail -n 200 "${RUNNER_TEMP}/frontend.log" || true
