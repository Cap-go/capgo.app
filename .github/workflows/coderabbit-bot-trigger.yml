name: Trigger CodeRabbit review for bot pushes

on:
  push:
    branches:
      - 'cursor/**'
      - 'feat/admin-famous-apps'
      - 'posthog-self-driving/*'
      - 'posthog-self-driving/fixcli-throw-cliusererror-from-bundle-b1ae1e'
  workflow_dispatch:

concurrency:
  group: coderabbit-bot-trigger-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  issues: write
  pull-requests: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const branch = context.ref.replace('refs/heads/', '')
            const prs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              head: `${owner}:${branch}`,
              state: 'open',
            })
            if (prs.length === 0) {
              console.log('No open PR for this branch')
              return
            }

            for (const pr of prs) {
              const headSha = pr.head.sha
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner,
                repo,
                pull_number: pr.number,
              })
              const latestCodeRabbitReview = reviews
                .filter(review => review.user?.login === 'coderabbitai[bot]')
                .pop()

              if (
                latestCodeRabbitReview?.commit_id === headSha
                && latestCodeRabbitReview.state !== 'CHANGES_REQUESTED'
              ) {
                console.log(`CodeRabbit already reviewed PR #${pr.number} at ${headSha}`)
                continue
              }

              const marker = `<!-- coderabbit-trigger:${headSha} -->`
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: pr.number,
              })
              if (comments.some(comment =>
                comment.user?.login === 'github-actions[bot]'
                && comment.body?.includes(marker)
              )) {
                console.log(`CodeRabbit trigger already posted for PR #${pr.number}`)
                continue
              }

              const needsFullReview = !latestCodeRabbitReview
                || latestCodeRabbitReview.commit_id !== headSha
                || latestCodeRabbitReview.state === 'CHANGES_REQUESTED'
              const reviewCommand = needsFullReview
                ? '@coderabbitai full review'
                : '@coderabbitai review'

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body: `${marker}\n${reviewCommand}`,
              })
            }
