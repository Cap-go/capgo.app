name: Trigger CodeRabbit review for bot pushes

on:
  push:
    branches:
      - 'cursor/**'
      - 'feat/admin-famous-apps'
      - 'fix/security-ghsa-*'
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

concurrency:
  group: coderabbit-bot-trigger-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# pull-requests: write is required: GITHUB_TOKEN gets 403 on issues.createComment
# for PRs when only pull-requests: read is granted (see run 32975845301).
permissions:
  issues: write
  pull-requests: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo

            let prs
            if (context.eventName === 'pull_request_review') {
              const review = context.payload.review
              if (review.state !== 'APPROVED') {
                console.log(`Ignoring non-approval review state: ${review.state}`)
                return
              }
              if (review.user?.login === 'coderabbitai[bot]') {
                console.log('Ignoring CodeRabbit approval event')
                return
              }
              const pr = context.payload.pull_request
              const branch = pr.head.ref
              const allowed =
                branch.startsWith('cursor/')
                || branch === 'feat/admin-famous-apps'
                || branch.startsWith('fix/security-ghsa-')
              if (!allowed) {
                console.log(`Skipping PR branch ${branch}`)
                return
              }
              prs = [pr]
            }
            else {
              const branch = context.ref.replace('refs/heads/', '')
              prs = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                head: `${owner}:${branch}`,
                state: 'open',
              })
            }

            if (prs.length === 0) {
              console.log('No open PR for this branch')
              return
            }

            // Only org members/owners can supersede a stale CodeRabbit review.
            for (const pr of prs) {
              const headSha = context.eventName === 'push'
                ? context.sha
                : pr.head.sha
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner,
                repo,
                pull_number: pr.number,
              })
              const codeRabbitReviews = reviews
                .filter(review => review.user?.login === 'coderabbitai[bot]')
              const latestCodeRabbitReview = codeRabbitReviews.at(-1)

              const headApproved = reviews.some(review =>
                review.commit_id === headSha
                && review.state === 'APPROVED'
                && review.user?.type === 'User'
                && (review.author_association === 'MEMBER'
                  || review.author_association === 'OWNER')
              )

              const staleChangeRequests = codeRabbitReviews.filter(review =>
                review.state === 'CHANGES_REQUESTED'
                && review.commit_id !== headSha
              )
              if (staleChangeRequests.length > 0 && headApproved) {
                for (const review of staleChangeRequests) {
                  await github.rest.pulls.dismissReview({
                    owner,
                    repo,
                    pull_number: pr.number,
                    review_id: review.id,
                    message: `Superseded: maintainer approved HEAD ${headSha.slice(0, 7)} after addressing prior CodeRabbit feedback.`,
                  })
                  console.log(`Dismissed stale CodeRabbit review ${review.id} on PR #${pr.number}`)
                }
              }

              // Skip only when CodeRabbit already approved this SHA (COMMENTED does not clear CHANGES_REQUESTED).
              if (
                latestCodeRabbitReview?.commit_id === headSha
                && latestCodeRabbitReview.state === 'APPROVED'
              ) {
                console.log(`CodeRabbit already approved PR #${pr.number} at ${headSha}`)
                continue
              }

              const marker = `<!-- coderabbit-trigger:${headSha} -->`
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: pr.number,
              })
              const alreadyTriggered = comments.some(comment =>
                comment.user?.login === 'github-actions[bot]'
                && comment.body?.includes(marker)
              )
              // Skip only when a prior trigger already produced an approval on headSha.
              if (
                alreadyTriggered
                && latestCodeRabbitReview?.commit_id === headSha
                && latestCodeRabbitReview.state === 'APPROVED'
              ) {
                console.log(`CodeRabbit trigger already completed for PR #${pr.number} at ${headSha}`)
                continue
              }
              if (alreadyTriggered) {
                console.log(`Retrying CodeRabbit trigger for PR #${pr.number}; prior trigger had no review on ${headSha}`)
              }

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body: `${marker}\n@coderabbitai review`,
              })
            }
