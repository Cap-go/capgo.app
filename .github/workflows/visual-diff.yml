name: Visual diff

concurrency:
  group: visual-diff-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - edited

permissions:
  contents: read

env:
  # Pull Supabase CLI images from GHCR instead of the default public.ecr.aws,
  # whose anonymous pull quota fails CI with "toomanyrequests: Data limit exceeded".
  SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      requested: ${{ steps.check.outputs.requested }}
    steps:
      - name: Detect visual diff request
        id: check
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          requested=false
          if printf '%s' "$PR_LABELS" | grep -Eq '"name"[[:space:]]*:[[:space:]]*"visual-change"'; then
            requested=true
          elif printf '%s' "$PR_BODY" | grep -q '<!-- visual-diff:required -->'; then
            requested=true
          fi
          echo "requested=${requested}" >> "$GITHUB_OUTPUT"

  # Builds the console at both revisions (seconds each) and keeps only the routes whose code
  # changed, so a PR that touches one page screenshots that page instead of all of them.
  plan:
    needs: check
    if: needs.check.outputs.requested == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Plan affected routes
    permissions:
      contents: read
    outputs:
      routes: ${{ steps.plan.outputs.routes }}
      count: ${{ steps.plan.outputs.count }}
      shard_total: ${{ steps.plan.outputs.shard_total }}
      shards: ${{ steps.plan.outputs.shards }}
      summary: ${{ steps.plan.outputs.summary }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Setup bun
        run: bash scripts/setup-bun.sh

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Plan affected routes
        id: plan
        # The merge commit is what lands, so its diff against the base is exactly this PR.
        run: bun scripts/visual-diff-plan.ts --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.sha }}" --github-output

  # Each phase/shard pair runs on its own runner with a fresh stack. Captures took ~9s per
  # route serially; the plan sizes the matrix to the routes that changed.
  capture:
    needs: [check, plan]
    if: needs.check.outputs.requested == 'true' && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Capture ${{ matrix.phase }} screenshots (shard ${{ matrix.shard }}/${{ needs.plan.outputs.shard_total }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        phase: [before, after]
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Setup bun
        run: bash scripts/setup-bun.sh

      - name: Install dependencies
        run: bun install

      - name: Install Playwright browser
        # scripts/visual-diff.ts launches headless with no `channel`, so only the headless shell is used.
        run: bunx playwright install --with-deps --only-shell chromium

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.109.1

      - name: Link Supabase templates
        run: ln -sfn supabase/templates templates

      - name: Capture screenshots
        timeout-minutes: 20
        env:
          ROUTES: ${{ needs.plan.outputs.routes }}
          SHARD: ${{ matrix.shard }}/${{ needs.plan.outputs.shard_total }}
        run: |
          bun scripts/visual-diff.ts run \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.sha }}" \
            --only-phase "${{ matrix.phase }}" \
            --routes "$ROUTES" \
            --shard "$SHARD"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: visual-diff-${{ matrix.phase }}-${{ matrix.shard }}-${{ github.event.pull_request.head.sha }}
          path: |
            .context/visual-diff/${{ matrix.phase }}/
            .context/visual-diff/logs/
          if-no-files-found: ignore
          retention-days: 1

  visual-diff:
    needs: [check, plan, capture]
    if: ${{ !cancelled() && needs.check.outputs.requested == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Generate visual diff report
    permissions:
      contents: read
      pull-requests: write # Upsert the sticky visual diff PR comment only in this job
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup bun
        run: bash scripts/setup-bun.sh

      - name: Install dependencies
        run: bun install

      - name: Download screenshots
        if: needs.plan.outputs.count != '0'
        uses: actions/download-artifact@v6
        with:
          pattern: visual-diff-*-${{ github.event.pull_request.head.sha }}
          path: .context/visual-diff
          merge-multiple: true

      - name: Compare screenshots
        id: compare
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          ROUTES: ${{ needs.plan.outputs.routes }}
          CAPTURE_RESULT: ${{ needs.capture.result }}
        run: |
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "::error::Planning the affected routes ended with '$PLAN_RESULT'."
            exit 1
          fi
          if [ -z "$ROUTES" ]; then
            mkdir -p .context/visual-diff/report
            printf '## Visual changes\n\nNo route needed a screenshot.\n' > .context/visual-diff/report/summary.md
            exit 0
          fi
          bun scripts/visual-diff.ts diff --routes "$ROUTES"
          if [ "$CAPTURE_RESULT" != "success" ]; then
            echo "::error::At least one screenshot capture shard ended with '$CAPTURE_RESULT'; the report may be incomplete."
            exit 1
          fi

      - name: Upload visual diff report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: visual-diff-report-${{ github.event.pull_request.head.sha }}
          path: |
            .context/visual-diff/report/
            .context/visual-diff/logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Comment visual diff summary on PR
        if: ${{ !cancelled() }}
        uses: actions/github-script@v8
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_NAME: visual-diff-report-${{ github.event.pull_request.head.sha }}
          PLAN_SUMMARY: ${{ needs.plan.outputs.summary }}
        with:
          script: |
            const fs = require('node:fs')
            const path = require('node:path')
            const marker = '<!-- capgo-visual-diff -->'
            const issue_number = context.payload.pull_request.number
            const summaryPath = path.join(process.env.GITHUB_WORKSPACE, '.context/visual-diff/report/summary.md')
            const ok = process.env.JOB_STATUS === 'success'
            const summary = fs.existsSync(summaryPath)
              ? fs.readFileSync(summaryPath, 'utf8').trim()
              : 'Visual diff did not produce a report. Check the workflow logs and artifacts.'

            const body = [
              marker,
              `## Visual diff ${ok ? 'passed' : 'failed'}`,
              '',
              summary,
              '',
              ...(process.env.PLAN_SUMMARY ? [process.env.PLAN_SUMMARY, ''] : []),
              `Commit: \`${process.env.HEAD_SHA}\``,
              `[Download the HTML report from workflow artifacts](${process.env.RUN_URL}) (artifact: \`${process.env.ARTIFACT_NAME}\`).`,
              '',
              'Open `index.html` from the artifact for side-by-side before/after/diff screenshots.',
            ].join('\n')

            const { owner, repo } = context.repo
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            })
            const existing = comments.find(comment => comment.body?.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              })
            }
            else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              })
            }
