name: Bump version

concurrency:
  group: ${{ github.run_attempt == 1 && !startsWith(github.event.head_commit.message, 'chore(release):') && !startsWith(github.event.head_commit.message, 'chore(auto-sync):') && format('bump-version-{0}', github.ref) || format('bump-version-isolated-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - development

permissions: {}

jobs:
  changes:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    outputs:
      run_capgo: ${{ steps.capgo.outputs.should_release }}
      capgo_release_as: ${{ steps.capgo.outputs.release_as }}
      run_cli: ${{ steps.cli.outputs.should_release }}
      cli_release_as: ${{ steps.cli.outputs.release_as }}
      run_notifications: ${{ steps.notifications.outputs.should_release }}
      notifications_release_as: ${{ steps.notifications.outputs.release_as }}
      run_any: ${{ steps.capgo.outputs.should_release == 'true' || steps.cli.outputs.should_release == 'true' || steps.notifications.outputs.should_release == 'true' }}
      test_capgo: ${{ steps.reuse.outputs.test_capgo }}
      test_cli: ${{ steps.reuse.outputs.test_cli }}
      test_notifications: ${{ steps.reuse.outputs.test_notifications }}
      test_any: ${{ steps.reuse.outputs.test_any }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Validate safe version workflow re-run
        if: ${{ github.run_attempt > 1 }}
        run: |
          set -euo pipefail

          current_sha="$(git ls-remote --heads origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
          if [ "$current_sha" != "$GITHUB_SHA" ]; then
            echo "::error::$GITHUB_REF_NAME advanced after this workflow started. Retry the latest commit instead."
            exit 1
          fi

          git fetch --force --prune --prune-tags origin '+refs/tags/*:refs/tags/*'
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            all_release_tags="$(git tag --contains "$GITHUB_SHA" --list 'capgo-[0-9]*' 'cli-[0-9]*' 'notifications-[0-9]*')"
            release_tags="$(printf '%s\n' "$all_release_tags" | grep -v -- '-alpha\.' || true)"
          else
            release_tags="$(git tag --contains "$GITHUB_SHA" --list 'capgo-*-alpha.*' 'cli-*-alpha.*' 'notifications-*-alpha.*')"
          fi
          if [ -n "$release_tags" ]; then
            echo "::error::A release tag already contains $GITHUB_SHA; this workflow must not publish it again."
            printf '%s\n' "$release_tags"
            exit 1
          fi
      - name: Setup bun
        run: bash scripts/setup-bun.sh
      - name: Resolve release environment
        id: release_environment
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "scope_mode=--latest-stable" >> "$GITHUB_OUTPUT"
          else
            echo "scope_mode=--latest-alpha" >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve Capgo release scope
        id: capgo
        run: bun scripts/release-scope.ts capgo "${{ steps.release_environment.outputs.scope_mode }}" "${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Resolve CLI release scope
        id: cli
        run: bun scripts/release-scope.ts cli "${{ steps.release_environment.outputs.scope_mode }}" "${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Resolve notifications plugin release scope
        id: notifications
        run: bun scripts/release-scope.ts notifications "${{ steps.release_environment.outputs.scope_mode }}" "${{ github.sha }}" >> "$GITHUB_OUTPUT"
      # A same-repo PR run records each scope that passed for its merge commit, keyed by a
      # fingerprint that ignores release-bot files. When the pushed commit has the same
      # fingerprint, that scope already passed on this exact source, so skip re-running it.
      - name: Reuse PR test results for identical source
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          NEED_CAPGO: ${{ steps.capgo.outputs.should_release }}
          NEED_CLI: ${{ steps.cli.outputs.should_release }}
          NEED_NOTIFICATIONS: ${{ steps.notifications.outputs.should_release }}
          FORCE_TESTS: ${{ github.run_attempt > 1 }}
        run: |
          set -euo pipefail

          fingerprint="$(bun scripts/release-test-fingerprint.ts "$GITHUB_SHA")"
          repository_id="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.id')"
          echo "Release test fingerprint: $fingerprint"

          scope_passed() {
            local name="release-tests-$1-$fingerprint"
            local run_ids
            run_ids="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/artifacts" -f name="$name" -f per_page=20 \
              --jq ".artifacts[] | select(.expired == false and .workflow_run.repository_id == $repository_id and .workflow_run.head_repository_id == $repository_id) | .workflow_run.id" || true)"
            for run_id in $run_ids; do
              if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
                --jq 'select(.path == ".github/workflows/tests.yml" and .event == "pull_request") | .id' | grep -q .; then
                echo "$1 tests already passed for this source in run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id"
                return 0
              fi
            done
            return 1
          }

          test_any=false
          for scope in capgo cli notifications; do
            need_var="NEED_${scope^^}"
            run_tests=false
            if [ "${!need_var}" = "true" ]; then
              run_tests=true
              if [ "$FORCE_TESTS" != "true" ] && scope_passed "$scope"; then
                run_tests=false
              fi
            fi
            if [ "$run_tests" = "true" ]; then
              test_any=true
            fi
            echo "test_$scope=$run_tests" >> "$GITHUB_OUTPUT"
          done
          echo "test_any=$test_any" >> "$GITHUB_OUTPUT"
  # Run only the relevant test scope not already proven by an identical PR run
  test:
    needs: changes
    if: ${{ needs.changes.outputs.run_any == 'true' && needs.changes.outputs.test_any == 'true' }}
    uses: ./.github/workflows/tests.yml
    with:
      run_capgo: ${{ needs.changes.outputs.test_capgo == 'true' }}
      run_cli: ${{ needs.changes.outputs.test_cli == 'true' }}
      run_notifications: ${{ needs.changes.outputs.test_notifications == 'true' }}
    permissions:
      contents: read
      actions: write
      # The reusable tests workflow declares PR read access for its path filter job.
      pull-requests: read

  # Only bump the changed release scopes and create matching tags after tests pass
  bump-version:
    needs: [changes, test]
    if: ${{ always() && !startsWith(github.event.head_commit.message, 'chore(release):') && needs.changes.result == 'success' && needs.changes.outputs.run_any == 'true' && (needs.test.result == 'success' || (needs.test.result == 'skipped' && needs.changes.outputs.test_any == 'false')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Bump versions and create tags
    permissions:
      contents: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
      native_build: ${{ steps.capgo_version.outputs.native_build }}
      capgo_tag: ${{ steps.capgo_tag.outputs.tag }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Check out
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
          token: "${{ secrets.PERSONAL_ACCESS_TOKEN }}"
      - name: Validate safe version workflow re-run
        if: ${{ github.run_attempt > 1 }}
        run: |
          set -euo pipefail

          current_sha="$(git ls-remote --heads origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
          if [ "$current_sha" != "$GITHUB_SHA" ]; then
            echo "::error::$GITHUB_REF_NAME advanced after this workflow started. Retry the latest commit instead."
            exit 1
          fi

          git fetch --force --prune --prune-tags origin '+refs/tags/*:refs/tags/*'
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            all_release_tags="$(git tag --contains "$GITHUB_SHA" --list 'capgo-[0-9]*' 'cli-[0-9]*' 'notifications-[0-9]*')"
            release_tags="$(printf '%s\n' "$all_release_tags" | grep -v -- '-alpha\.' || true)"
          else
            release_tags="$(git tag --contains "$GITHUB_SHA" --list 'capgo-*-alpha.*' 'cli-*-alpha.*' 'notifications-*-alpha.*')"
          fi
          if [ -n "$release_tags" ]; then
            echo "::error::A release tag already contains $GITHUB_SHA; this workflow must not publish it again."
            printf '%s\n' "$release_tags"
            exit 1
          fi
      - name: Setup bun
        run: bash scripts/setup-bun.sh
      - name: Install dependencies
        if: ${{ needs.changes.outputs.run_capgo == 'true' || needs.changes.outputs.run_cli == 'true' || needs.changes.outputs.run_notifications == 'true' }}
        run: bun install --frozen-lockfile
      - name: Record tested release state
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/release-base-sha"
          git tag --list | sort > "$RUNNER_TEMP/release-tags-before"
      - name: Resolve Capgo native release bump
        id: capgo_version
        if: ${{ needs.changes.outputs.run_capgo == 'true' }}
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          DEFAULT_RELEASE_AS: ${{ needs.changes.outputs.capgo_release_as }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            channel="production"
          else
            channel="dev"
          fi

          set +e
          bunx @capgo/cli@latest build needed --channel "$channel"
          exit_code=$?
          set -e

          if [ "$exit_code" -eq 0 ]; then
            echo "release_as=$DEFAULT_RELEASE_AS" >> "$GITHUB_OUTPUT"
            echo "native_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$exit_code" -ne 1 ]; then
            echo "::error::build needed failed with exit code $exit_code"
            exit "$exit_code"
          fi

          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            previous_tag="$(git describe --tags --match 'capgo-*' --exclude '*-alpha.*' --abbrev=0 2>/dev/null || true)"
          else
            previous_tag="$(git describe --tags --match 'capgo-*-alpha.*' --abbrev=0 2>/dev/null || true)"
          fi
          if [ -n "$previous_tag" ]; then
            if ! release_is_draft="$(gh release view "$previous_tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"; then
              echo "::error::Could not confirm a completed GitHub Release for $previous_tag. No new version will be created."
              exit 1
            fi
            if [ "$release_is_draft" != "false" ]; then
              echo "::error::$previous_tag is still a draft GitHub Release. No new version will be created."
              exit 1
            fi
          fi

          echo "release_as=major" >> "$GITHUB_OUTPUT"
          echo "native_build=true" >> "$GITHUB_OUTPUT"
      - name: Git config
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
      - name: Generate CLI docs
        if: ${{ needs.changes.outputs.run_cli == 'true' }}
        run: |
          bun run cli:build
          bun run --cwd cli generate-docs
          bun run --cwd cli generate-docs --folder webdocs
          git add cli/README.md cli/webdocs
          if ! git diff --cached --quiet; then
            git commit -m "docs(cli): update generated docs"
          fi
      - name: Create version bumps
        env:
          RUN_CAPGO: ${{ needs.changes.outputs.run_capgo }}
          CAPGO_RELEASE_AS: ${{ steps.capgo_version.outputs.release_as }}
          RUN_CLI: ${{ needs.changes.outputs.run_cli }}
          CLI_RELEASE_AS: ${{ needs.changes.outputs.cli_release_as }}
          RUN_NOTIFICATIONS: ${{ needs.changes.outputs.run_notifications }}
          NOTIFICATIONS_RELEASE_AS: ${{ needs.changes.outputs.notifications_release_as }}
        run: |
          set -e

          if [ "$RUN_CAPGO" = "true" ]; then
            if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              bunx standard-version --skip.changelog --release-as "$CAPGO_RELEASE_AS" --tag-prefix capgo-
            else
              bunx standard-version --skip.changelog --release-as "$CAPGO_RELEASE_AS" --prerelease alpha --tag-prefix capgo-
            fi

            git add supabase/functions/_backend/utils/version.ts
            if ! git diff --cached --quiet; then
              CURRENT_TAG=$(git describe --tags --exact-match 2>/dev/null || echo "")
              git commit --amend --no-edit

              if [ -n "$CURRENT_TAG" ]; then
                git tag -f "$CURRENT_TAG"
              fi
            fi
          fi

          if [ "$RUN_CLI" = "true" ]; then
            if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              bunx standard-version --skip.changelog --release-as "$CLI_RELEASE_AS" --tag-prefix cli- --packageFiles cli/package.json --bumpFiles cli/package.json
            else
              bunx standard-version --skip.changelog --release-as "$CLI_RELEASE_AS" --prerelease alpha --tag-prefix cli- --packageFiles cli/package.json --bumpFiles cli/package.json
            fi
          fi

          if [ "$RUN_NOTIFICATIONS" = "true" ]; then
            if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              bunx standard-version --skip.changelog --release-as "$NOTIFICATIONS_RELEASE_AS" --tag-prefix notifications- --packageFiles packages/capacitor-notifications/package.json --bumpFiles packages/capacitor-notifications/package.json
            else
              bunx standard-version --skip.changelog --release-as "$NOTIFICATIONS_RELEASE_AS" --prerelease alpha --tag-prefix notifications- --packageFiles packages/capacitor-notifications/package.json --bumpFiles packages/capacitor-notifications/package.json
            fi

            bun scripts/sync-notifications-package-version.ts
            git add packages/capacitor-notifications/src/version.ts
            if ! git diff --cached --quiet; then
              CURRENT_TAG=$(git describe --tags --exact-match 2>/dev/null || echo "")
              git commit --amend --no-edit

              if [ -n "$CURRENT_TAG" ]; then
                git tag -f "$CURRENT_TAG"
              fi
            fi
          fi
      - name: Resolve new Capgo tag
        id: capgo_tag
        if: ${{ needs.changes.outputs.run_capgo == 'true' }}
        run: |
          tag="$(git tag --list | sort | comm -13 "$RUNNER_TEMP/release-tags-before" - | grep '^capgo-[0-9]' | grep -v -- '-alpha\.' | head -n 1 || true)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Publish release atomically
        id: publish
        env:
          RELEASE_REMOTE_URL: https://x-access-token:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          set -e

          status="$(bun scripts/publish-release.ts \
            "$GITHUB_REF_NAME" \
            "$(< "$RUNNER_TEMP/release-base-sha")" \
            "$RUNNER_TEMP/release-tags-before")"
          if [ "$status" = "published" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
  # A native change needs a new store binary: build both platforms from the new
  # tag and submit them for store review without manual dispatch.
  native-store-release:
    needs: bump-version
    if: ${{ github.ref == 'refs/heads/main' && needs.bump-version.outputs.published == 'true' && needs.bump-version.outputs.native_build == 'true' && needs.bump-version.outputs.capgo_tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Trigger native store builds
    permissions:
      actions: write
    steps:
      - name: Dispatch iOS and Android store builds
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.bump-version.outputs.capgo_tag }}
        run: |
          gh workflow run build_mobile_ios.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG" -f submit_to_store_review=true
          gh workflow run build_mobile_android.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG" -f submit_to_store_review=true
