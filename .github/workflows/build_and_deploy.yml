name: Build source code and deploy

concurrency:
  group: ${{ github.workflow }}-${{ contains(github.ref_name, '-alpha.') && 'alpha' || 'production' }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "capgo-[0-9]*"

permissions: {}

env:
  # Pull Supabase CLI images from GHCR instead of the default public.ecr.aws,
  # whose anonymous pull quota fails CI with "toomanyrequests: Data limit exceeded".
  SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Resolve deploy scope
    permissions:
      contents: write
      actions: read
    outputs:
      state_oid: ${{ steps.scope.outputs.state_oid }}
      plugin_matrix: ${{ steps.scope.outputs.plugin_matrix }}
      api: ${{ steps.scope.outputs.api }}
      files: ${{ steps.scope.outputs.files }}
      gotrue: ${{ steps.scope.outputs.gotrue }}
      plugins: ${{ steps.scope.outputs.plugins }}
      supabase: ${{ steps.scope.outputs.supabase }}
      translation: ${{ steps.scope.outputs.translation }}
      deploy_tag: ${{ steps.target.outputs.deploy_tag }}
      deploy_sha: ${{ steps.target.outputs.deploy_sha }}
      is_alpha: ${{ steps.target.outputs.is_alpha }}
      requires_schema_types_sync: ${{ steps.scope.outputs.requires_schema_types_sync }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Resolve immutable deployment attempt target
        id: target
        run: bun scripts/resolve-deploy-tag.ts --attempt "${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Reject stale queued deployment
        run: bun scripts/resolve-deploy-tag.ts --assert-current "${{ steps.target.outputs.deploy_tag }}"
      - name: Checkout deployment target
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.target.outputs.deploy_sha }}
          fetch-depth: 0
          filter: blob:none
      - name: Install deployment helper dependencies
        run: bun install --frozen-lockfile
      - name: Resolve deploy scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_TAG: ${{ steps.target.outputs.deploy_tag }}
          DEPLOY_SHA: ${{ steps.target.outputs.deploy_sha }}
        run: bun scripts/deploy-state.ts begin >> "$GITHUB_OUTPUT"

  # Tests already passed before tag was created, so just build and deploy
  read_replica_schema:
    needs: changes
    if: ${{ needs.changes.result == 'success' && needs.changes.outputs.supabase == 'true' && needs.changes.outputs.is_alpha != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    name: Reconcile production read-replica schema
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.deploy_sha }}
          fetch-depth: 0
          filter: blob:none
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Reject stale deployment retry
        if: ${{ github.run_attempt > 1 }}
        run: bun scripts/resolve-deploy-tag.ts --assert-current "${{ needs.changes.outputs.deploy_tag }}"
      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
      - name: Install dependencies
        run: bun install
      - name: Reconcile the Google subscriber through server-side Cloud SQL import
        env:
          GOOGLE_SERVICE_ACCOUNT_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: |
          credentials_file="$(mktemp)"
          trap 'rm -f "$credentials_file"' EXIT
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_BASE64" | base64 --decode > "$credentials_file"
          gcloud auth activate-service-account --key-file="$credentials_file"
          gcloud config set project capgo-394818
          bun scripts/sync-read-replica-schema.ts --apply --allow-drop

  supabase_deploy:
    needs: [changes, read_replica_schema]
    if: ${{ always() && needs.changes.result == 'success' && needs.changes.outputs.supabase == 'true' && (needs.read_replica_schema.result == 'success' || needs.read_replica_schema.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: Build code and deploy to Supabase
    permissions:
      contents: read
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.deploy_sha }}
          fetch-depth: 0
          filter: blob:none
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Reject stale deployment retry
        if: ${{ github.run_attempt > 1 }}
        run: bun scripts/resolve-deploy-tag.ts --assert-current "${{ needs.changes.outputs.deploy_tag }}"
      - name: Set environment variable
        run: |
          if [ "${{ needs.changes.outputs.is_alpha }}" = "true" ]; then
            echo "SUPA_ENV=ALPHA" >> $GITHUB_ENV
          else
            echo "SUPA_ENV=PROD" >> $GITHUB_ENV
          fi
      - name: Set Supabase credentials (ALPHA)
        if: env.SUPA_ENV == 'ALPHA'
        run: |
          echo "SUPABASE_DB_PASSWORD=${{ secrets.SUPABASE_DB_PASS_ALPHA }}" >> $GITHUB_ENV
          echo "SUPABASE_PROJECT_ID=${{ secrets.SUPABASE_PROJECT_ID_ALPHA }}" >> $GITHUB_ENV
      - name: Set Supabase credentials (PROD)
        if: env.SUPA_ENV == 'PROD'
        run: |
          echo "SUPABASE_DB_PASSWORD=${{ secrets.SUPABASE_DB_PASS_PROD }}" >> $GITHUB_ENV
          echo "SUPABASE_PROJECT_ID=${{ secrets.SUPABASE_PROJECT_ID_PROD }}" >> $GITHUB_ENV
      - name: Install dependencies
        run: bun install
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2.0.0
        with:
          version: 2.109.1
      - name: Prepare Supabase
        run: supabase link --project-ref ${{ env.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
      - name: Apply Supabase Migrations
        env:
          # Each secret is gated on its own env, so a missing PROD secret never falls back to ALPHA.
          DATABASE_URL: ${{ (env.SUPA_ENV == 'PROD' && secrets.DATABASE_URL_PROD) || (env.SUPA_ENV == 'ALPHA' && secrets.DATABASE_URL_ALPHA) || '' }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret DATABASE_URL_$SUPA_ENV isn't configured"
            exit 1
          fi
          bash scripts/push-release-migrations.sh
      - name: Setup Google Cloud CLI
        if: env.SUPA_ENV == 'PROD'
        uses: google-github-actions/setup-gcloud@v2
      - name: Guard read-replica schema against primary migrations
        if: env.SUPA_ENV == 'PROD'
        env:
          GOOGLE_SERVICE_ACCOUNT_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: |
          credentials_file="$(mktemp)"
          trap 'rm -f "$credentials_file"' EXIT
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_BASE64" | base64 --decode > "$credentials_file"
          gcloud auth activate-service-account --key-file="$credentials_file"
          gcloud config set project capgo-394818
          bun scripts/sync-read-replica-schema.ts --guard
      - name: Update functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
        # Capgo cloud publishes allowlisted functions only (pg_net + functions.invoke).
        # Self-hosting keeps deploying all functions via `supabase functions deploy`.
        run: |
          FUNCTIONS=($(bun scripts/supabase-cloud-functions.ts list))
          if [ "${#FUNCTIONS[@]}" -eq 0 ]; then
            echo "Capgo cloud function allowlist is empty; refusing to deploy all functions" >&2
            exit 1
          fi
          supabase functions deploy "${FUNCTIONS[@]}"
          # Remove Capgo-cloud-only functions that are no longer allowlisted.
          # Self-host installs are unaffected (they deploy every local function).
          SKIPPED=($(bun scripts/supabase-cloud-functions.ts skip-list))
          for fn in "${SKIPPED[@]}"; do
            if ! out=$(supabase functions delete "$fn" 2>&1); then
              if echo "$out" | grep -qiE 'not found|does not exist|404|Function not found'; then
                continue
              fi
              echo "$out" >&2
              exit 1
            fi
          done

  # Migrations may add tables to the Google publication; the subscriber only
  # streams them once its subscription is refreshed. Migration
  # 20261029015108_delta_sessions (#3979) adds delta_sessions to the
  # publication, adds delta_files.path_session_id, and a delta_sessions_move
  # cron task that NULLs path_session. With a stale replica subscription,
  # delta_sessions is empty on replicas, so once CAPGO_DELTA_SESSIONS_ENABLED is
  # turned on, new workers return empty manifests for moved versions and old
  # workers build S3 paths without the session part. Keep that flag off until
  # this refresh succeeds and every api, files, and plugin worker runs the new
  # release. Current prod: flag off, 0 rows moved. This job still runs on every
  # production release and must stay visible when it fails, but worker deploys
  # no longer wait on it so releases are not blocked on subscription ownership
  # errors (read_replica_schema still reconciles table DDL before migrations).
  read_replica_subscription:
    needs: [changes, supabase_deploy, read_replica_schema]
    if: ${{ needs.changes.result == 'success' && needs.changes.outputs.supabase == 'true' && needs.changes.outputs.is_alpha != 'true' && needs.supabase_deploy.result == 'success' && needs.read_replica_schema.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    name: Refresh production read-replica subscription
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.deploy_sha }}
          fetch-depth: 0
          filter: blob:none
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Reject stale deployment retry
        if: ${{ github.run_attempt > 1 }}
        run: bun scripts/resolve-deploy-tag.ts --assert-current "${{ needs.changes.outputs.deploy_tag }}"
      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
      - name: Install dependencies
        run: bun install
      - name: Fetch release tags
        run: git fetch --tags origin
      - name: Assert deploy tag is current
        run: bun scripts/resolve-deploy-tag.ts --assert-current "${{ needs.changes.outputs.deploy_tag }}"
      - name: Refresh subscription for newly published tables
        env:
          GOOGLE_SERVICE_ACCOUNT_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: |
          credentials_file="$(mktemp)"
          trap 'rm -f "$credentials_file"' EXIT
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_BASE64" | base64 --decode > "$credentials_file"
          gcloud auth activate-service-account --key-file="$credentials_file"
          gcloud config set project capgo-394818
          bun scripts/sync-read-replica-schema.ts --refresh-subscription

  # Build the web app while the backend deploys; only publishing waits for it.
  build_webapp:
    needs: changes
    if: ${{ needs.changes.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Build webapp
    permissions:
      contents: read
    outputs:
      native_build_needed: ${{ steps.release_check.outputs.native_build_needed }}
      changelog: ${{ steps.changelog.outputs.result }}
      changelog_from_tag: ${{ steps.changelog.outputs.from_tag }}
      changelog_to_tag: ${{ steps.changelog.outputs.to_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.deploy_sha }}
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Set environment variable
        run: |
          if [ "${{ needs.changes.outputs.is_alpha }}" = "true" ]; then
            echo "ENV=dev" >> $GITHUB_ENV
            echo "CHANNEL=dev" >> $GITHUB_ENV
          else
            echo "ENV=prod" >> $GITHUB_ENV
            echo "CHANNEL=production" >> $GITHUB_ENV
          fi
      - parallel:
          - name: Check if native build is required
            id: release_check
            env:
              CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
            run: |
              set +e
              bunx @capgo/cli@latest build needed --channel "${{ env.CHANNEL }}"
              exit_code=$?
              set -e
              if [ "$exit_code" -eq 0 ]; then
                echo "native_build_needed=false" >> "$GITHUB_OUTPUT"
                echo "Release type: OTA"
              elif [ "$exit_code" -eq 1 ]; then
                echo "native_build_needed=true" >> "$GITHUB_OUTPUT"
                echo "Release type: native"
              else
                echo "build needed check failed with exit code $exit_code"
                exit "$exit_code"
              fi
          - name: Build
            run: bun run ${{ env.ENV == 'prod' && 'build' || 'build:dev' }}
            env:
              VITE_VAPID_KEY: ${{ secrets.VITE_VAPID_KEY }}
              VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG }}
          - name: Generate AI changelog
            id: changelog
            continue-on-error: true
            env:
              CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
              CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            run: bun run changelog:ai
      - name: Upload web build
        uses: actions/upload-artifact@v6
        with:
          name: webapp-dist
          path: dist
          retention-days: 1
          include-hidden-files: true

  deploy_webapp:
    needs: [changes, build_webapp, supabase_deploy, read_replica_schema, read_replica_subscription]
    if: ${{ always() && needs.changes.result == 'success' && needs.build_webapp.result == 'success' && (needs.supabase_deploy.result == 'success' || needs.supabase_deploy.result == 'skipped') && (needs.read_replica_schema.result == 'success' || needs.read_replica_schema.result == 'skipped') && (needs.read_replica_subscription.result == 'success' || needs.read_replica_subscription.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      native_build_needed: ${{ needs.build_webapp.outputs.native_build_needed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.deploy_sha }}
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Reject stale deployment retry
        if: ${{ github.run_attempt > 1 }}
        run: bun scripts/resolve-deploy-tag.ts --assert-current "${{ needs.changes.outputs.deploy_tag }}"
      - parallel:
          - name: Install dependencies
            run: bun install
          - name: Download web build
            uses: actions/download-artifact@v6
            with:
              name: webapp-dist
              path: dist
      - name: Set environment variable
        run: |
          if [ "${{ needs.changes.outputs.is_alpha }}" = "true" ]; then
            echo "ENV=dev" >> $GITHUB_ENV
            echo "CHANNEL=dev" >> $GITHUB_ENV
          else
            echo "ENV=prod" >> $GITHUB_ENV
            echo "CHANNEL=production" >> $GITHUB_ENV
          fi
      - parallel:
          - name: Publish CF console
            run: bun run deploy:cloudflare:console:${{ env.ENV }}
            env:
              CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
              CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          - name: Deploy OTA bundle to Capgo
            # --send-update-notification wakes installed apps with a silent push so they
            # download this bundle in the background instead of waiting for the next launch.
            run: bunx @capgo/cli@latest bundle upload --channel ${{ env.CHANNEL }} --delta --send-update-notification
            env:
              CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
      - name: Create GitHub release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## 🆕 Changelog

            ${{ needs.build_webapp.outputs.changelog || '_Changelog was not generated automatically for this release._' }}

            ---

            🔗 **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ needs.build_webapp.outputs.changelog_from_tag || needs.changes.outputs.deploy_tag }}...${{ needs.build_webapp.outputs.changelog_to_tag || needs.changes.outputs.deploy_tag }}
          make_latest: true
          token: "${{ secrets.PERSONAL_ACCESS_TOKEN }}"
          tag_name: ${{ needs.changes.outputs.deploy_tag }}
          prerelease: ${{ needs.changes.outputs.is_alpha == 'true' }}

  deploy_api:
    needs: [changes, supabase_deploy, read_replica_schema]
    if: ${{ always() && needs.changes.result == 'success' && needs.changes.outputs.api == 'true' && (needs.supabase_deploy.result == 'success' || needs.supabase_deploy.result == 'skipped') && (needs.read_replica_schema.result == 'success' || needs.read_replica_schema.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.deploy_sha }}
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Reject stale deployment retry
        if: ${{ github.run_attempt > 1 }}
        run: bun scripts/resolve-deploy-tag.ts --assert-current "${{ needs.changes.outputs.deploy_tag }}"
      - name: Install dependencies
        run: bun install
      - name: Set environment variable
        run: |
          if [ "${{ needs.changes.outputs.is_alpha }}" = "true" ]; then
            echo "ENV=dev" >> $GITHUB_ENV
          else
            echo "ENV=prod" >> $GITHUB_ENV
          fi
      - name: Deploy CF Worker API
        run: |
          set -euo pipefail
          : "${CHANGELOG_GITHUB_TOKEN:?Missing GitHub credential for release notes}"
          secrets_file=$(mktemp)
          trap 'rm -f "$secrets_file"' EXIT
          # The Actions GITHUB_TOKEN expires after this job; use the existing long-lived credential.
          bun -e 'await Bun.write(process.argv[1], JSON.stringify({ GITHUB_TOKEN: process.env.CHANGELOG_GITHUB_TOKEN }))' "$secrets_file"
          bun run deploy:cloudflare:api:${{ env.ENV }} --secrets-file "$secrets_file"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CHANGELOG_GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      - name: Retire removed CF Workers
        if: ${{ env.ENV == 'prod' }}
        run: bun scripts/retire-cloudflare-workers.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Self-hosted GoTrue (auth migration). Production only, and no route yet: nothing reaches it
  # until the API binds it. Secrets are pushed by hand (deploy:cloudflare_env:gotrue:prod).
  deploy_gotrue_worker:
    needs: [changes]
    if: ${{ needs.changes.result == 'success' && needs.changes.outputs.gotrue == 'true' && needs.changes.outputs.is_alpha != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.deploy_sha }}
          fetch-depth: 0
          filter: blob:none
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Reject stale deployment retry
        if: ${{ github.run_attempt > 1 }}
        run: bun scripts/resolve-deploy-tag.ts --assert-current "${{ needs.changes.outputs.deploy_tag }}"
      - name: Install dependencies
        run: bun install
      - name: Deploy CF Worker GoTrue
        run: bun run deploy:cloudflare:gotrue:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy_translation_worker:
    needs: [changes, supabase_deploy, read_replica_schema]
    if: ${{ always() && needs.changes.result == 'success' && needs.changes.outputs.translation == 'true' && (needs.supabase_deploy.result == 'success' || (needs.supabase_deploy.result == 'skipped' && needs.changes.outputs.supabase != 'true')) && (needs.read_replica_schema.result == 'success' || needs.read_replica_schema.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.deploy_sha }}
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Reject stale deployment retry
        if: ${{ github.run_attempt > 1 }}
        run: bun scripts/resolve-deploy-tag.ts --assert-current "${{ needs.changes.outputs.deploy_tag }}"
      - name: Install dependencies
        run: bun install
      - name: Set environment variable
        run: |
          if [ "${{ needs.changes.outputs.is_alpha }}" = "true" ]; then
            echo "ENV=dev" >> $GITHUB_ENV
          else
            echo "ENV=prod" >> $GITHUB_ENV
          fi
      - name: Deploy CF Worker Translation
        run: bun run deploy:cloudflare:translation:${{ env.ENV }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy_files:
    needs: [changes, supabase_deploy, read_replica_schema]
    if: ${{ always() && needs.changes.result == 'success' && needs.changes.outputs.files == 'true' && (needs.supabase_deploy.result == 'success' || needs.supabase_deploy.result == 'skipped') && (needs.read_replica_schema.result == 'success' || needs.read_replica_schema.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.deploy_sha }}
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Reject stale deployment retry
        if: ${{ github.run_attempt > 1 }}
        run: bun scripts/resolve-deploy-tag.ts --assert-current "${{ needs.changes.outputs.deploy_tag }}"
      - name: Install dependencies
        run: bun install
      - name: Set environment variable
        run: |
          if [ "${{ needs.changes.outputs.is_alpha }}" = "true" ]; then
            echo "ENV=dev" >> $GITHUB_ENV
          else
            echo "ENV=prod" >> $GITHUB_ENV
          fi
      - name: Deploy CF Worker Files
        run: bun run deploy:cloudflare:files:${{ env.ENV }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy_plugin_regions:
    needs: [changes, supabase_deploy, read_replica_schema]
    if: ${{ always() && needs.changes.result == 'success' && needs.changes.outputs.plugins == 'true' && (needs.supabase_deploy.result == 'success' || needs.supabase_deploy.result == 'skipped') && (needs.read_replica_schema.result == 'success' || needs.read_replica_schema.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.plugin_matrix) }}
    name: Deploy CF Worker Plugin (${{ matrix.region_label }})
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.deploy_sha }}
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Reject stale deployment retry
        if: ${{ github.run_attempt > 1 }}
        run: bun scripts/resolve-deploy-tag.ts --assert-current "${{ needs.changes.outputs.deploy_tag }}"
      - name: Install dependencies
        run: bun install
      - name: Set environment variable
        run: |
          if [ "${{ needs.changes.outputs.is_alpha }}" = "true" ]; then
            echo "ENV=dev" >> $GITHUB_ENV
          else
            echo "ENV=prod" >> $GITHUB_ENV
          fi
      - name: Deploy CF Worker Plugin
        run: bun run deploy:cloudflare:${{ matrix.cf_target }}:${{ env.ENV }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Reconcile every stable release so a missed/failed snippet rollout is retried
  # even when the next release only changes another component.
  deploy_snippets:
    needs: [changes, supabase_deploy, read_replica_schema, read_replica_subscription, deploy_api, deploy_files, deploy_plugin_regions, deploy_gotrue_worker]
    if: ${{ always() && needs.changes.result == 'success' && needs.changes.outputs.is_alpha != 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Deploy Cloudflare snippets
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.deploy_sha }}
          fetch-depth: 0
          filter: blob:none
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Reject stale deployment retry
        if: ${{ github.run_attempt > 1 }}
        run: bun scripts/resolve-deploy-tag.ts --assert-current "${{ needs.changes.outputs.deploy_tag }}"
      - name: Deploy and verify all production snippets
        run: bun run deploy:snippets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy_native_ios:
    needs: [changes, supabase_deploy, deploy_webapp]
    if: ${{ always() && needs.changes.result == 'success' && (needs.supabase_deploy.result == 'success' || needs.supabase_deploy.result == 'skipped') && needs.deploy_webapp.result == 'success' && needs.deploy_webapp.outputs.native_build_needed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.deploy_sha }}
          fetch-depth: 0
          filter: blob:none
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Reject stale deployment retry
        if: ${{ github.run_attempt > 1 }}
        run: bun scripts/resolve-deploy-tag.ts --assert-current "${{ needs.changes.outputs.deploy_tag }}"
      - name: Set environment variable
        run: |
          if [ "${{ needs.changes.outputs.is_alpha }}" = "true" ]; then
            echo "BUILD_SCRIPT=build:dev" >> $GITHUB_ENV
          else
            echo "BUILD_SCRIPT=build" >> $GITHUB_ENV
          fi
      - name: Install dependencies
        run: bun install --frozen-lockfile --linker=hoisted
      - name: Prepare mobile project
        run: |
          bun run ${{ env.BUILD_SCRIPT }}
          bash scripts/vendor-workspace-native-plugins.sh
          bunx cap sync ios
      - name: Request iOS build through Capgo CLI
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
          APP_STORE_CONNECT_TEAM_ID: ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          CAPGO_IOS_PROVISIONING_MAP_BASE64: ${{ secrets.CAPGO_IOS_PROVISIONING_MAP_BASE64 }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_KEY_CONTENT: ${{ secrets.APPLE_KEY_CONTENT }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_OUTPUT_UPLOAD_ENABLED: "true"
          BUILD_OUTPUT_RETENTION_SECONDS: "604800"
        run: bunx @capgo/cli@latest build request --platform ios --path . --sync-ios-version --xcode-version 27 --ai-analytics

  deploy_native_android:
    needs: [changes, supabase_deploy, deploy_webapp]
    if: ${{ always() && needs.changes.result == 'success' && (needs.supabase_deploy.result == 'success' || needs.supabase_deploy.result == 'skipped') && needs.deploy_webapp.result == 'success' && needs.deploy_webapp.outputs.native_build_needed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.deploy_sha }}
          fetch-depth: 0
          filter: blob:none
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Reject stale deployment retry
        if: ${{ github.run_attempt > 1 }}
        run: bun scripts/resolve-deploy-tag.ts --assert-current "${{ needs.changes.outputs.deploy_tag }}"
      - name: Set environment variable
        run: |
          if [ "${{ needs.changes.outputs.is_alpha }}" = "true" ]; then
            echo "BUILD_SCRIPT=build:dev" >> $GITHUB_ENV
          else
            echo "BUILD_SCRIPT=build" >> $GITHUB_ENV
          fi
      - name: Install dependencies
        run: bun install --frozen-lockfile --linker=hoisted
      - name: Prepare mobile project
        run: |
          bun run ${{ env.BUILD_SCRIPT }}
          bash scripts/vendor-workspace-native-plugins.sh
          bunx cap sync android
      - name: Add Firebase config for push notifications
        # google-services.json is gitignored. Without it the google-services Gradle
        # plugin is skipped and FCM (Capgo update pushes) cannot start on Android.
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret is missing; Android push notifications are disabled in this build"
          fi
      - name: Request Android build through Capgo CLI
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
          ANDROID_KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_FILE }}
          PLAY_CONFIG_JSON: ${{ secrets.PLAY_CONFIG_JSON }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          BUILD_OUTPUT_UPLOAD_ENABLED: "true"
          BUILD_OUTPUT_RETENTION_SECONDS: "604800"
        run: bunx @capgo/cli@latest build request --platform android --path . --sync-android-version --ai-analytics

  sync_schema_types:
    needs: [changes, read_replica_schema, supabase_deploy]
    if: ${{ needs.changes.result == 'success' && needs.changes.outputs.is_alpha != 'true' && needs.changes.outputs.requires_schema_types_sync == 'true' && needs.read_replica_schema.result == 'success' && needs.supabase_deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Sync production schema and generated types
    permissions:
      contents: write
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.deploy_sha }}
          token: "${{ secrets.PERSONAL_ACCESS_TOKEN }}"
          fetch-depth: 0
          filter: blob:none
      - name: Setup bun
        run: bash scripts/setup-bun.sh
      - name: Prepare production schema access
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
          SUPABASE_PROJECT_ID_PROD: ${{ secrets.SUPABASE_PROJECT_ID_PROD }}
        run: |
          if [ -z "$SUPABASE_PROJECT_ID_PROD" ]; then
            echo "SUPABASE_PROJECT_ID_PROD is required for schema/types sync" >&2
            exit 1
          fi

          bunx supabase --version
          bunx supabase link --project-ref "$SUPABASE_PROJECT_ID_PROD"
      - name: Sync generated schema and types
        env:
          DEPLOY_TAG: ${{ needs.changes.outputs.deploy_tag }}
          SCHEMA_TYPES_REMOTE_URL: https://x-access-token:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/${{ github.repository }}.git
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
        run: |
          set -euo pipefail

          generated_files=(
            supabase/schemas/prod.sql
            src/types/supabase.types.ts
            supabase/functions/_backend/utils/supabase.types.ts
          )
          remote_repo="$SCHEMA_TYPES_REMOTE_URL"

          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Schema/types publication attempt $attempt of 3"
            git fetch --tags "$remote_repo" "+refs/heads/main:refs/remotes/schema-sync/main"
            main_sha="$(git rev-parse refs/remotes/schema-sync/main)"

            if ! bun scripts/resolve-deploy-tag.ts --assert-current "$DEPLOY_TAG"; then
              echo "Schema/types sync deferred: $DEPLOY_TAG is no longer the current production tag."
              exit 0
            fi

            pending_migrations="$(git diff --name-only "$DEPLOY_TAG" "$main_sha" -- supabase/migrations)"
            if [ -n "$pending_migrations" ]; then
              echo "Schema/types sync deferred: main contains migrations that are not present in $DEPLOY_TAG."
              printf '%s\n' "$pending_migrations"
              exit 0
            fi

            git checkout --detach "$main_sha"
            bun install --frozen-lockfile
            bun schemas
            BRANCH=main bun types

            if git diff --quiet -- "${generated_files[@]}"; then
              echo "No schema/types drift detected."
              exit 0
            fi

            echo "Schema/types drift detected; verifying regenerated types compile against current main."
            if ! bun typecheck; then
              echo "Schema/types sync deferred: production-generated types do not compile against current main." >&2
              exit 0
            fi

            git add -- "${generated_files[@]}"
            git commit -m "chore(auto-sync): update supabase schema and generated types"

            git fetch --tags "$remote_repo"
            if ! bun scripts/resolve-deploy-tag.ts --assert-current "$DEPLOY_TAG"; then
              echo "Schema/types sync deferred: a newer production tag was published during generation."
              exit 0
            fi

            status="$(bun scripts/publish-schema-types.ts main "$main_sha")"
            if [ "$status" = "published" ]; then
              echo "Schema/types commit published from main at $main_sha."
              exit 0
            fi

            echo "Main moved during schema/types generation; regenerating from the new head."
          done

          echo "Schema/types publication could not obtain a stable main snapshot after 3 attempts." >&2
          exit 1

  record_deployments:
    needs: [changes, read_replica_schema, supabase_deploy, read_replica_subscription, deploy_api, deploy_translation_worker, deploy_files, deploy_gotrue_worker, deploy_plugin_regions]
    if: ${{ always() && needs.changes.result == 'success' }}
    name: Record completed deployment operations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout immutable deployment target
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.deploy_sha }}
          fetch-depth: 0
          filter: blob:none
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deployment helper dependencies
        run: bun install --frozen-lockfile
      - name: Record actual attempt operations with CAS
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_TAG: ${{ needs.changes.outputs.deploy_tag }}
          DEPLOY_SHA: ${{ needs.changes.outputs.deploy_sha }}
          DEPLOY_STATE_OID: ${{ needs.changes.outputs.state_oid }}
        run: bun scripts/deploy-state.ts complete
